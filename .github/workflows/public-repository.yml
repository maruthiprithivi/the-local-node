name: Public repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked website dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website/ai-field-engineer
      - name: Check public paths, lesson alignment and tests
        run: |
          node scripts/check-public-repository.mjs
          node website/ai-field-engineer/scripts/repository.mjs --check
          node --test website/ai-field-engineer/scripts/repository.test.mjs
      - name: Scan all fetched Git history for secrets
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
  episode-kv-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the episode 1 KV cache calculator
        working-directory: episodes/01-kv-cache
        run: python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the chart series selection
        working-directory: episodes/01-kv-cache/chart
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test src/series.check.mjs
