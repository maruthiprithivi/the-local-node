# Day 2 · Local stack on the Mac. Plain-language content for the guided course.
# Schema: 05-web/docs/course-spec.md section 3. Style: plain/style.md.
# Every number traces to a kit file (paths relative to the kit root):
#   L02   03-labs/lessons/02-three-local-servers/README.md (+ serve_llamacpp.sh, serve_mlx.sh, compare_backends.sh)
#   L00   03-labs/lessons/00-setup/README.md line 23 (4.9 GB download), line 39 (273 GB/s, about 56 tok/s)
#   L01   03-labs/lessons/01-latency-harness/README.md line 45 (sample Ollama row: ITL 22.4 ms, 44.6 tok/s)
#   bench 03-labs/lessons/01-latency-harness/bench_ttft.py (192-token replies, 12-token prompt, warm-up call)
#   felab 03-labs/felab/targets.py (ports, model names; line 66 llama-server ignores the model name,
#         line 78 the Spark's vLLM model nvidia/Llama-3.1-8B-Instruct-FP8), measure.py (nearest-rank percentile)
#   memo  03-labs/lessons/15-capstone/build_memo.py lines 48, 87-90 (lists the latest 01-latency rows)
#   quant 03-labs/lessons/04-quantization/quant_bench.sh line 6 (Q4_K_M about 4.8 bits, 4.9 GB)
#   L05   03-labs/lessons/05-kv-cache/README.md lines 14, 37 (128 KiB per token, 4,096 MiB at 32,768 tokens)
#   L14   03-labs/lessons/14-spark-track/README.md lines 9-10 (DGX Spark: 128 GB, about 273 GB/s)
#   narr  04-video-source/src/narration.json lines 1080-1228 (Serving With vLLM)
#   FG    02-lab-book/inference-field-guide.html line 628 (about three quarters of a word per token),
#         line 773 (tour bus and taxi rank), line 815 (chunked prefill banquet), line 836 (SGLang),
#         line 860 (espresso machine), line 1733 (Ollama vs vLLM)
# Arithmetic: 8,192 / 4 = 2,048; 8,192 x 0.75 = 6,144; 2,048 x 0.75 = 1,536; 192 x 0.75 = 144;
#   44.6 x 0.75 = 33.5; 1,000 / 22.4 = 44.6; 273 / 4.9 = 55.7; 8e9 x 0.5 B = 4 GB; 4.9 + 4 = 8.9;
#   8,000 / 2,048 = 3.9; 4 x 8,192 = 32,768; 32,768 x 131,072 B = 4.29 GB; 8,234 x 16 = 131,744;
#   8,192 / 16 = 512; 131,744 / 8,192 = 16.08; 8,234 / 512 = 16.08; 131,744 x 2 = 263,488;
#   263,488 / 8,192 = 32.2; 131,744 / 4,096 = 32.2; 263,488 / 4,096 = 64.3; 50 / 16 = 3.1;
#   0.5 / 1.6 = 0.31; 1.6 / 0.5 = 3.2; 1 - 0.3125 = 69%.

day: 2
tile: "Run one model three ways on your Mac, then compare them"

overview:
  today: "Run one AI model through three server programs on your Mac: Ollama, llama.cpp and MLX. A server program loads the model and answers requests. Then time all three with Day 1's timing script, and compare their speed and which settings each lets you see."
  example: "Imagine a support chat that needs to remember what a customer said earlier. This server reserves room for four chats at once, but gives each only about 1,500 words of memory. A longer conversation may lose its earlier details. Today you will see where that limit comes from and which program lets you change it."
  deliverable: "Three writing speeds from the same script, one per server: how many tokens (word pieces) each writes per second."
  expected: "MLX usually writes fastest, and Ollama lands close to llama.cpp. Day 1's sample Ollama row wrote 44.6 tokens per second, about 33 words a second."
  before:
    - title: "Day 1's setup is in place."
      body: "Today reuses what Day 1 installed: Ollama with the Llama 3.1 8B model (the 4.9 GB download), llama.cpp, Apple's MLX, and the kit's Python toolkit (felab). Check it from the `03-labs` folder (use your own path if you put it elsewhere on Day 1):"
      command: "cd ~/Downloads/03-labs && source .venv/bin/activate && make check"
      after: "Look for `ollama` marked UP. If it says down, start it with `ollama serve` in its own terminal. `llamacpp` and `mlx` say down until you start them today."
    - title: "About 10 GB of free disk space."
      body: "llama.cpp and MLX each download their own 4-bit copy of the model the first time they start. llama.cpp's is 4.9 GB. MLX's is at least 4 GB: 8 billion numbers x half a byte (4 bits) each. That is about 9 GB; 10 GB leaves a little spare. Ollama reuses its Day 1 copy."
    - title: "Four terminal windows."
      body: "Three servers each run in their own terminal and keep running; the fourth runs the comparison. In each new terminal, run:"
      command: "cd ~/Downloads/03-labs && source .venv/bin/activate && cd lessons/02-three-local-servers"
      after: "This goes to the code folder (use your own path if you put it elsewhere on Day 1), turns on the kit's Python environment ((.venv) appears at the start of the line), and moves into today's lesson folder. The MLX server and the comparison script both need the environment."
  feeds: >-
    Your benchmark's second page: one model timed on three servers, the evidence behind today's line "Ollama is
    llama.cpp with the flags hidden." The rows are saved in `results/01-latency.csv`, and Day 10's sizing memo
    (your written hardware recommendation) lists the latest timing rows from that file.

steps:
  d2-s1:
    why: "Customers serve models with different server programs, and each hides or exposes different settings. You run one model on three of them on your Mac and time each with the same script."
    why_example: "A customer asks why their chat bot forgets the start of a long conversation. In today's llama.cpp setup, four chats share room for about 6,000 words, so each gets only about 1,500. You can see and change that limit in llama.cpp; Ollama chooses settings like this for you."
    start_first:
      command: "bash lessons/02-three-local-servers/serve_llamacpp.sh Q4_K_M 8192 4"
      note: "In a new terminal, go to your `03-labs` folder (`cd ~/Downloads/03-labs`, as on Day 1) and run the command above. Leave it running while you watch: its first start downloads the 4.9 GB model file. This is terminal 2 below. For MLX, open another terminal and run `cd ~/Downloads/03-labs && source .venv/bin/activate && bash lessons/02-three-local-servers/serve_mlx.sh`. That is terminal 3; its first start downloads the MLX copy."
    videos:
      09-serving-stack:
        in_this_video: "What a server program for AI models does and the five settings that matter most, shown on vLLM, a server built for NVIDIA chips."
        key_points:
          - point: "A server program for AI models does 4 jobs. It takes requests, groups them to share the chip, keeps each conversation's notes (the model's memory of it so far), and runs the math fast."
            detail: "Take one away and you have a demo, not a service. vLLM became the default because of the middle two jobs. People join and leave the group at every step (continuous batching), and notes are handed out a page at a time (PagedAttention)."
          - point: "On NVIDIA AI machines such as the DGX Spark (a desktop AI computer), run the server inside a container: a sealed package with the exact software versions it needs."
            detail: "The chip's driver, NVIDIA's CUDA software and the Python packages must all match, and often do not. Installing without a container often needs a documented workaround, which costs 20 to 30% of total output."
          - point: "Five settings decide most of a server's performance: how fast it answers and how many people it serves. Three of them took the same machine from 16 conversations at once to 50."
            detail: "The three: reuse a shared prompt opening (prefix caching), read long prompts in pieces (chunked prefill), and store the notes in 8 bits (FP8 KV cache). Only after that, the video says, argue about hardware."
    plain:
      lead: "A model on its own is a big file of numbers. An inference server is the program that loads that file and answers requests from other programs. Ollama, llama.cpp and MLX are three such servers for your Mac. All three accept the same request format, so one timing script can test them all."
      picture: "Three cars carry the same load (the model) around one test track. Ollama is an automatic: it picks the gears for you. llama.cpp is the same motor with a manual gearbox, so you pick every gear. MLX is a different motor, built by the company that made the road (Apple's software for Apple chips)."
      numbers_source: "Llama 3.1 8B, lesson 02's scripts and Day 1's sample results"
      numbers:
        - "One model: Llama 3.1 8B (8 billion learned numbers), stored at about 4 bits per number. Ollama and llama.cpp each keep their own copy, a 4.9 GB file."
        - "Three servers, three doors (ports) on your Mac: Ollama 11434, llama.cpp 8080, MLX 8081."
        - "llama.cpp's settings today: room for notes on 8,192 tokens (word pieces; about 6,000 words), shared by 4 seats (4 conversations served at the same time). 8,192 ÷ 4 = 2,048 tokens per seat, about 1,500 words."
        - "One test for all three: Day 1's timing script, 5 requests per server, replies of up to 192 tokens (about 140 words)."
        - "Day 1's sample Ollama result: 44.6 tokens per second, about 33 words a second. MLX is usually faster; llama.cpp lands close to Ollama."
      words:
        - term: "Inference server"
          def: "the program that loads a model and answers requests. Example: llama.cpp's `llama-server`."
        - term: "Port"
          def: "a numbered door on your computer where one server listens for requests. Example: llama.cpp uses 8080."
        - term: "Notes (KV cache)"
          def: "the model's memory of each conversation so far, kept in the same memory as the model. Example: today's llama.cpp keeps room for 8,192 tokens of notes."
        - term: "Flag"
          def: "an option typed after a command that changes how the program runs. Example: `--parallel 4`."
    run:
      - cmd: "ollama serve"
        note: "Terminal 1: starts Ollama at port 11434 (a numbered door on your Mac), ready to serve the `llama3.1:8b` model from Day 1. Leave it running. **Look for** the window staying open with no error. If it says the address is already in use, Ollama is already running, so skip this terminal."
      - cmd: "bash serve_llamacpp.sh Q4_K_M 8192 4"
        note: "Terminal 2. Skip it if 'Start this first' already started it. This is llama.cpp's server at port 8080, with the 4-bit file (Q4_K_M, 4.9 GB, downloaded on the first run). It keeps room for 8,192 tokens, split across 4 seats. **Look for** `ctx=8192` and `slots=4` on its first line, then a line saying it is listening. 8,192 ÷ 4 = 2,048 tokens per seat: check 1 below is about that split."
      - cmd: "bash serve_mlx.sh"
        note: "Terminal 3. Skip it if 'Start this first' already started it; the Python environment must be on (see 'Before you start'). This is Apple's MLX server with its own 4-bit copy of the model, at port 8081, downloaded on the first run. **Look for** a line with `export MLX_MODEL=`. You need it only if the comparison later complains about the model name."
      - cmd: "bash compare_backends.sh"
        note: "Terminal 4, with the Python environment on (see 'Before you start'). It times each running server with Day 1's script: one uncounted warm-up, then 5 timed requests. It prints one small table per server and saves the rows to `results/01-latency.csv`. **Look for** three tables, and compare their `tok_per_s` column (writing speed)."
    see: "Each server prints one small table with one row. Read the `tok_per_s` column, the writing speed in tokens (word pieces) per second: MLX usually leads, and Ollama lands close to llama.cpp because it runs llama.cpp underneath. llama.cpp's row shows the model as `local`, because its server ignores the name. If Ollama is well behind, `ollama show llama3.1:8b` shows its copy's storage size per number (its quantization, such as Q4_K_M): a different one there is the first thing to rule out."
    checks:
      - q: "You start llama.cpp with `-c 8192` (room for 8,192 tokens, about 6,000 words) and `--parallel 4` (4 seats, so 4 people at once). Why is that a trap?"
        plain: "The 8,192 tokens are shared out, not given to each person. Each of the 4 seats gets only 2,048 tokens (about 1,500 words), so a longer conversation does not fit."
        picture: "One large pizza ordered 'for 4 people'. The box says large, but each person gets a quarter, and anyone hungrier than a quarter goes without."
        numbers_source: "Llama 3.1 8B on llama.cpp with Day 2's settings, lesson 02"
        numbers:
          - "Room for notes: `-c 8192` = 8,192 tokens, about 6,000 words."
          - "Seats: `--parallel 4` = 4 conversations at once."
          - "Each seat: 8,192 ÷ 4 = 2,048 tokens, about 1,500 words."
          - "Day 1's long test prompt, about 8,000 tokens, is almost 4 times one seat's room (8,000 ÷ 2,048 = 3.9), so it does not fit."
          - "The fix: set `-c` to seats x tokens each. For 4 seats of 8,192 tokens: 4 x 8,192 = 32,768, which takes 4.29 GB of notes for this model (Day 4 works this out)."
        words:
          - term: "Context length (`-c`)"
            def: "the most tokens the server keeps notes for. Example: `-c 8192` = 8,192 tokens."
          - term: "Slot (`--parallel`)"
            def: "one seat on the server: one conversation it serves at the same time. Example: `--parallel 4` = 4 seats."
          - term: "Token"
            def: "a chunk of text, about three quarters of a word. Example: 2,048 tokens is about 1,500 words."
          - term: "KV cache (notes)"
            def: "the model's notes on each conversation so far, kept in memory. Example: 32,768 tokens of notes take 4.29 GB for Llama 3.1 8B."
        more: "llama-server sets aside one KV cache of `-c` tokens at startup and splits it evenly across the `--parallel` slots (the comment in `serve_llamacpp.sh` says so), so each slot's context is c ÷ parallel. Size `-c` as slots x the longest context one user needs: 4 x 8,192 = 32,768, which is 4,096 MiB of f16 cache for Llama 3.1 8B at 128 KiB per token (lesson 05). llama-server's startup log lists the context each slot gets, so confirm it there on your build."
      - q: "A customer runs Ollama, the easy one-command server, for their live service with real users (production). What would you ask them about?"
        plain: "Ask how many people use it at the same moment, and what happens when many arrive at once. Ask how they watch its health. Then ask whether a server built for many users, such as vLLM or SGLang (servers for NVIDIA chips), would serve them better."
        picture: "A home espresso machine makes great coffee, one cup at a time. If a busy café runs on one, you ask how many customers come at the morning rush, how long the queue gets, and who notices when it breaks. At some point they need a café machine built to pour hundreds of cups an hour."
        numbers_source: "the Serving With vLLM video (Day 2) and lesson 02"
        numbers:
          - "Day 2's llama.cpp script shows its seats: `--parallel 4`, so 4 people at once with 2,048 tokens each. Ollama chooses settings like these for you, out of sight."
          - "In the Serving With vLLM video, vLLM (a server built for many users) prints its room for notes at startup: 8,234 blocks of 16 tokens each. A block is a fixed-size piece of note memory."
          - "8,234 x 16 = 131,744 tokens of notes. At 8,192 tokens per conversation: 131,744 ÷ 8,192 = 16.08, so 16 people at once if everyone uses the full length."
          - "In a separate example in the same video, three settings took one vLLM machine from 16 people at once to 50: 50 ÷ 16 = about 3 times as many."
          - "So ask: how many people at the busiest moment, and do numbers like these cover it?"
        words:
          - term: "Production"
            def: "a model running as a live service for real users. Example: the customer's support chat."
          - term: "People served at once (concurrency)"
            def: "how many conversations the server runs at the same moment. Example: 16 before tuning, 50 after, in the Serving With vLLM video."
          - term: "Batching"
            def: "serving several people with one pass over the model. Example: 4 seats share each pass in Day 2's llama.cpp server."
          - term: "Observability"
            def: "seeing what a live service is doing, such as speed, errors and memory, while it runs. Example: llama.cpp's `--metrics` flag."
        more: "Turn each topic into a number. Concurrency: peak simultaneous users. Batching limits: how many requests the engine batches (its parallel slots) and the context each slot gets, which Ollama sets by defaults the operator may never have read. Observability: TTFT and ITL at p50 and p95, errors and memory, live (llama.cpp's `--metrics` flag publishes counters at `/metrics`). Then run the same harness against vLLM or SGLang, which add PagedAttention and the tuning flags from the Serving With vLLM video; Day 9's optional Spark step does exactly that."
    say:
      ask: "Our team already serves our model with Ollama. Is that good enough for customers?"
      means:
        - phrase: "Ollama is llama.cpp"
          meaning: "Ollama is a friendly layer on top of llama.cpp, the engine (the program doing the work). Given the same 4-bit model (each keeps its own 4.9 GB copy), the two run at about the same speed, and your table should show it."
        - phrase: "with the flags hidden"
          meaning: "it picks the settings (flags) for you, such as how long a conversation may be and how many people share the server. `ollama show llama3.1:8b` reveals only some of them, such as the model file's storage size."
        - phrase: "For a customer workload I want the flags"
          meaning: "for a real customer's job I set those myself. Example: `-c 8192 --parallel 4` quietly gives each of 4 people only 2,048 tokens, and I need to see that."
        - phrase: "and for multi-user GPU serving"
          meaning: "when many people share one NVIDIA GPU (the chip that runs the model) in a live service at the same time,"
        - phrase: "I want vLLM or SGLang"
          meaning: "I use servers built for many users at once. In today's video, Serving With vLLM, three settings took one machine from 16 conversations at once to 50."
    fields:
      - id: d2-ollama-tps
        label: "Ollama: writing speed"
        hint: "The `tok_per_s` value in the ollama table from `bash compare_backends.sh`."
        unit: "tok/s"
        meaning: "How many tokens (word pieces) one person sees appear each second once the reply starts."
        example: "Day 1's sample Ollama row: 44.6, about 33 words a second."
      - id: d2-llamacpp-tps
        label: "llama.cpp: writing speed"
        hint: "The `tok_per_s` value in the llamacpp table."
        unit: "tok/s"
        meaning: "The same measure on llama.cpp, the engine Ollama runs on."
        example: "Close to your Ollama figure. llama.cpp cannot beat your Mac's speed limit for this 4.9 GB file: memory speed ÷ file size. Day 1's sample Mac: 273 GB per second ÷ 4.9 GB = about 56 tokens per second."
      - id: d2-mlx-tps
        label: "MLX: writing speed"
        hint: "The `tok_per_s` value in the mlx table."
        unit: "tok/s"
        meaning: "The same measure on Apple's own MLX server."
        example: "Usually the highest of your three figures."
    done: "`bash compare_backends.sh` prints a table for each of the three servers (ollama, llamacpp and mlx), and none of them says 'skipped'."
    stuck:
      - problem: "The comparison says `ollama is not running` (or llamacpp, or mlx) and skips it."
        fix: "That server is not up. Look in its terminal for an error and start it again. From the `03-labs` folder, with the Python environment on, `make check` lists which servers answer."
      - problem: "All three are skipped although the servers are running, and the address after 'at' is blank."
        fix: "The script could not load the kit's Python toolkit. In that terminal, go to the `03-labs` folder, run `source .venv/bin/activate`, then `bash lessons/02-three-local-servers/compare_backends.sh` (the script moves into its own folder by itself)."
      - problem: "`llama-server` or `mlx_lm.server`: command not found."
        fix: "For `mlx_lm.server`, the Python environment is usually off in that terminal: from the `03-labs` folder run `source .venv/bin/activate` and try again. If a command is still missing, rerun Day 1's setup script, which is safe to run again: `bash lessons/00-setup/setup_mac.sh`, then `source .venv/bin/activate`."
      - problem: "`ollama serve` says the address is already in use."
        fix: "Ollama is already running, probably still from Day 1. Leave it running and skip terminal 1."
      - problem: "The mlx row fails with an error about the model."
        fix: "The model name the script sends must match the one the MLX server loaded. The MLX server prints the exact line to use: run that `export MLX_MODEL=...` line in terminal 4, then compare again."
      - problem: "The lab book card's `BASE_URL=... python bench_ttft.py --model local` lines measure the practice server, or fail to connect, instead of your Mac's servers."
        fix: "Those lines belong to the lab book's own short script. Day 1's script picks a server with `--target` instead (`--target llamacpp`, `mlx` or `ollama`), or run `bash compare_backends.sh`."
    replace:
      - find: "appear in lesson 14 on the Spark."
        with: "appear in Day 9's optional Spark step, which needs an NVIDIA DGX Spark (a desktop AI computer)."
      - find: "Each flag is a concept from a later lesson."
        with: "Each flag is a concept from a later day: slots (seats) on Day 3, quantization (shrinking the model) and context (conversation length) on Day 4, offload (choosing which chip runs each part of the model) on Day 9."

wrapup:
  done: "The same timing script has measured all three servers on your Mac, and your table shows each one's writing speed in tokens per second."
  whiteboards:
    - video: "09-serving-stack"
      q: "A server program (vLLM) starts up. It prints how much memory the model took (8.4 GB) and how many blocks are left for conversation notes (8,234, each holding 16 tokens). Each conversation may hold up to 8,192 tokens. How many conversations fit at once? If that is too few, what do you change?"
      given: "A block is a fixed-size piece of memory for notes: it holds the notes on 16 tokens (word pieces). The server was started with `--max-model-len 8192`, so no conversation may be longer than 8,192 tokens (about 6,000 words). Plan for the worst case: every conversation uses all 8,192."
      plain: "About 16 conversations fit at once. To fit more, store the notes in 8 bits, or halve the longest allowed conversation to 4,096 tokens. Each change doubles it to about 32; both together give about 64. You change settings, not the GPU (the chip)."
      picture: "A storage building has 8,234 lockers, and each locker holds 16 boxes. Every tenant may need up to 8,192 boxes, which is 512 lockers, so the building can promise space to only 16 tenants. Pack the boxes twice as tight, or cap each tenant at half as many boxes, and it can promise 32."
      steps:
        - "Tokens of notes the memory holds: 8,234 blocks x 16 tokens = 131,744 tokens (the video rounds this to about 131,000)."
        - "Blocks one full conversation needs: 8,192 ÷ 16 = 512 blocks."
        - "Conversations at once, worst case: 131,744 ÷ 8,192 = 16.08, so 16 (the same as 8,234 ÷ 512)."
        - "Change 1, notes in 8 bits (`--kv-cache-dtype fp8`): each token's notes take half the space, so the same memory holds 131,744 x 2 = 263,488 tokens. 263,488 ÷ 8,192 = 32 conversations."
        - "Change 2, cap conversations at 4,096 tokens (`--max-model-len 4096`): 131,744 ÷ 4,096 = 32 conversations."
        - "Both together: 263,488 ÷ 4,096 = 64 conversations, four times the 16, on the same GPU."
      note: "The video does not name the model or the GPU. Before you lower the limit, check how long the customer's real conversations are: a limit below what they need breaks their product."
      kit_q: "Reading the startup log · vLLM prints this within the first ten seconds · model weights 8.4 GB · # GPU blocks 8,234 · block size 16 tokens"
      kit_a: "cache capacity 8,234 × 16 ≈ 131,000 tokens · at 8K context ≈ 16 concurrent requests · Too low? Change max-model-len or KV dtype — not the GPU"
      more: "vLLM loads the weights, then turns what is left of the memory it may claim (`--gpu-memory-utilization`, 0.8 in the video's command), after the weights and its own working memory, into KV blocks of 16 tokens. Capacity in tokens = blocks x block size; worst-case concurrency = capacity ÷ max-model-len = 131,744 ÷ 8,192 = 16.08. With PagedAttention, blocks are handed out as conversations grow, so real concurrency with shorter conversations is higher; 16 is what you can promise if everyone fills the window. FP8 KV halves the bytes per token, so the same memory holds twice as many blocks. 8.4 GB of weights is about what an 8-billion-parameter model takes at 1 byte per parameter, the format of the kit's own vLLM model (`nvidia/Llama-3.1-8B-Instruct-FP8` in `felab/targets.py`), but the video does not say which model it is."
      words:
        - term: "Block"
          def: "a fixed-size piece of note memory. Example: 16 tokens per block in vLLM."
        - term: "Notes (KV cache)"
          def: "the model's memory of each conversation so far. Example: 512 blocks for one full 8,192-token conversation here."
        - term: "Max model length"
          def: "the longest conversation the server allows. Example: `--max-model-len 8192`."
        - term: "Startup log"
          def: "what a server prints as it starts. Example: vLLM's shows the weights (8.4 GB) and the blocks left (8,234)."
    - video: "09-serving-stack"
      q: "In Serving With vLLM, one model on default settings handles 16 conversations at once. When prompts share the same opening, 95 of 100 requests wait up to 1.6 seconds for the first token (word piece). Which three settings do you try first, and what did the video measure after?"
      given: "Same machine and model before and after; only three settings change. The prompts share a common opening (a shared prefix), such as the same instructions at the top of every request. The 1.6 seconds is p95 TTFT: the time to first token that 95 of 100 requests stay under."
      plain: "Reuse the notes for the opening that prompts share, read long prompts in small pieces, and store the notes in 8 bits. In the video that took one machine from 16 conversations at once to 50. The wait for the first word piece that 95 of 100 requests stay under fell from 1.6 to 0.5 seconds."
      picture: "A busy kitchen. It makes the sauce every dish shares once, instead of fresh for each order (prefix caching). It preps a huge banquet order in batches so regular diners still get served (chunked prefill). And it writes order tickets in shorthand, so twice as many fit on the rail (8-bit notes). Same kitchen, three times the diners."
      steps:
        - "The three settings: `--enable-prefix-caching` (reuse the notes for a shared opening), `--enable-chunked-prefill` (read long prompts in pieces) and `--kv-cache-dtype fp8` (notes in 8 bits)."
        - "Conversations at once: 16 before, 50 after. 50 ÷ 16 = 3.1 times as many, with no new hardware."
        - "8-bit notes alone about double it: 16 x 2 = 32 (the video's settings list: 'roughly doubles concurrency'). The video does not say how the rest splits between the other two settings."
        - "Wait for the first token that 95 of 100 requests stay under (p95 TTFT, shared opening): 1.6 s before, 0.5 s after. 0.5 ÷ 1.6 = 0.31, about a third of the wait: over 3 times faster."
        - "Why the wait drops: with prefix caching the shared opening is not read again for every request, and chunked prefill stops one long prompt from freezing everyone else."
        - "Only then compare hardware. The video's own words: 'Then, and only then, argue about hardware.'"
      note: "The narration says the tuning 'halved' time to first token. Its own table, 1.6 to 0.5 seconds, shows a cut of more than two thirds: quote the table."
      kit_q: "Three flags, measured"
      kit_a: "Here is a five minute tuning pass on one model. Turning on prefix caching and chunked prefill, and moving the cache to eight bits, took the same hardware from sixteen concurrent sessions to fifty, and halved time to first token on a shared prompt. Those three flags are the first thing to try in any customer deployment. · Then, and only then, argue about hardware."
      more: "In vLLM, requests that share a prefix share its KV blocks and skip its prefill, which cuts TTFT and the memory each session needs. Chunked prefill splits long prefills into chunks interleaved with decode steps, trading a little TTFT on the long prompt for smoother streaming for everyone (Batching & Scheduling, Day 3). FP8 KV halves the bytes per token. The video reports only the combined result: FP8 KV alone accounts for about 2x (16 to 32), and the rest most plausibly comes from prefix sharing. 1.6 s to 0.5 s is a 69% cut (3.2 times faster), more than the 'halved' in the narration. On recent vLLM releases (the V1 engine), prefix caching and chunked prefill are already on by default, so check what the customer's version turns on before promising those two as wins; the FP8 cache is still opt-in."
      words:
        - term: "Prefix caching"
          def: "reusing the notes for a prompt opening that many requests share. Example: the same instructions at the top of every chat."
        - term: "Chunked prefill"
          def: "reading a long prompt in pieces, between other people's writing steps, so it does not freeze their replies."
        - term: "FP8 KV cache"
          def: "notes stored with 8 bits per number instead of 16: half the memory. Example: `--kv-cache-dtype fp8`."
        - term: "p95 TTFT"
          def: "the wait for the first token that 95 of 100 requests stay under. Example: 1.6 s before tuning, 0.5 s after."

glossary:
  - term: "4-bit, 8-bit, 16-bit"
    def: "how many bits store each number; fewer bits, smaller model."
    example: "an 8B model is 8.5 GB at 8-bit, 4.9 GB at 4-bit."
  - term: "API"
    def: "the agreed format one program uses to send requests to another and get answers back."
    example: "`/v1/chat/completions` is where a chat request goes."
  - term: "Bandwidth (memory bandwidth)"
    def: "how many GB per second memory delivers to the chip."
    example: "M4 Max 546 GB/s, H100 3,350 GB/s."
  - term: "Batching"
    def: "serving several people with one pass over the model."
    example: "8 people share each fetch of the weights."
  - term: "Bit"
    def: "a single 0 or 1; 8 bits make a byte."
    example: "a 16-bit number is 2 bytes."
  - term: "Block (KV block)"
    def: "a fixed-size piece of note memory holding the notes for a few tokens; vLLM hands blocks out as conversations grow."
    example: "16 tokens per block; 8,234 blocks in the Serving With vLLM startup log."
  - term: "Byte"
    def: "8 bits."
    example: "one FP16 number takes 2 bytes."
  - term: "Ceiling (speed limit)"
    def: "the fastest a model can write: memory speed ÷ model size (for a mixture-of-experts model, only the part it reads per token)."
    example: "546 ÷ 4.9 = 111 tokens/s."
  - term: "Chip"
    def: "the processor that does the model's math."
    example: "an Apple M4 Max, or an NVIDIA H100 (a GPU)."
  - term: "Chunked prefill"
    def: "reading a long prompt in pieces, between other people's writing steps, so one long prompt does not freeze everyone else."
    example: "`--enable-chunked-prefill` in vLLM."
  - term: "Concurrency (people served at once)"
    def: "how many conversations the server runs at the same moment."
    example: "8 on the practice server."
  - term: "Container"
    def: "a sealed package holding a program and the exact software versions it needs, so it runs the same on any machine."
    example: "Serving With vLLM starts the `vllm/vllm-openai:latest` container with `docker run` (Docker is the usual container tool)."
  - term: "Context length (context, ctx)"
    def: "the most tokens one conversation may hold."
    example: "8K = 8,192 tokens."
  - term: "Continuous batching"
    def: "letting requests join and leave the shared group at every writing step, instead of waiting for the whole group to finish."
    example: "a finished reply's seat is refilled at the next step, like a taxi rank rather than a tour bus."
  - term: "CPU"
    def: "the computer's general-purpose processor, slower than the GPU for model math."
    example: "model layers not placed on the GPU run here."
  - term: "CSV file"
    def: "a plain table file: one row per line, commas between the columns."
    example: "`results/01-latency.csv`, where the comparison saves its rows."
  - term: "CUDA"
    def: "NVIDIA's software layer that lets programs run on its GPUs."
    example: "a Mac has none; llama.cpp uses Metal instead."
  - term: "CUDA graphs"
    def: "a GPU speed-up that records a sequence of work once and replays it, instead of launching each piece separately."
    example: "the documented no-container workaround gives it up and loses 20 to 30% of throughput."
  - term: "Decode"
    def: "the writing phase, one token at a time, fetching the whole model for each (a mixture-of-experts model fetches only the part it uses)."
    example: "86 tokens/s at 4-bit."
  - term: "Deployment (production)"
    def: "a model running as a live service for real users."
    example: "running out of note memory is the most common production failure."
  - term: "DGX Spark"
    def: "NVIDIA's desktop AI computer, with 128 GB of memory shared by its CPU and GPU."
    example: "about 273 GB/s of memory speed; Day 9's optional step runs vLLM and SGLang on it."
  - term: "Docker"
    def: "the common tool for building and running containers."
    example: "Serving With vLLM starts vLLM with `docker run`."
  - term: "Driver"
    def: "the software that lets the operating system use a piece of hardware such as a GPU."
    example: "the driver, CUDA and the Python packages must agree on an NVIDIA machine."
  - term: "Engine (inference server)"
    def: "the program that loads a model and answers requests."
    example: "llama.cpp, vLLM."
  - term: "f16 / FP16"
    def: "a 16-bit number format, 2 bytes per number."
    example: "the default format for the notes."
  - term: "felab"
    def: "the kit's small shared Python toolkit that every lesson script imports."
    example: "`felab/targets.py` lists every server's address."
  - term: "Flag"
    def: "an option typed after a command that changes how the program runs."
    example: "`--parallel 4` gives llama.cpp 4 slots."
  - term: "FP8"
    def: "an 8-bit number format, 1 byte per number, with built-in math on H100."
    example: "a 70B model is 70 GB in FP8."
  - term: "GB"
    def: "1,000,000,000 bytes."
    example: "16,384 MiB = 17.18 GB."
  - term: "GGUF"
    def: "llama.cpp's model file format, one file per size."
    example: "a `Q4_K_M.gguf` file."
  - term: "GPU"
    def: "the chip that runs the model."
    example: "H100; on a Mac it shares memory with everything else."
  - term: "GPU memory utilization (--gpu-memory-utilization)"
    def: "the share of the GPU's memory vLLM may claim for the model and its notes."
    example: "0.8 means 80% of the card."
  - term: "Harness"
    def: "one test script you can point at any server, so the numbers compare fairly."
    example: "`bench_ttft.py`, first run on Day 1 and reused on Day 2."
  - term: "Health endpoint"
    def: "an address that answers once the server is ready to take requests."
    example: "`curl -sf localhost:8000/health`."
  - term: "Homebrew (brew)"
    def: "a Mac tool that installs programs from the command line."
    example: "`brew install llama.cpp`."
  - term: "Hugging Face"
    def: "the public website where most open model files are shared."
    example: "`serve_llamacpp.sh` downloads its 4.9 GB file from there."
  - term: "Inference"
    def: "running a trained model to get answers, as opposed to training it."
    example: "an inference server answers requests."
  - term: "ITL (inter-token latency)"
    def: "the gap between one token and the next while a reply is being written."
    example: "22.4 ms in Day 1's sample Ollama row: 1,000 ÷ 22.4 = 44.6 tokens per second."
  - term: "K (in 8K, 32K, 128K)"
    def: "1,024 when counting tokens."
    example: "128K = 131,072 tokens."
  - term: "KB, KiB"
    def: "1,024 bytes in this course (the videos write KB, `kv_calc.py` prints KiB)."
    example: "128 KB = 131,072 bytes."
  - term: "Kernel"
    def: "a small program that runs one piece of the model's math on the GPU."
    example: "running the model with fast kernels is a serving engine's fourth job."
  - term: "KV cache"
    def: "the model's notes on the conversation so far (keys and values), so it does not reread everything for each new word."
    example: "17.18 GB for one 131,072-token conversation."
  - term: "KV cache dtype"
    def: "the number format the notes are stored in; 8-bit instead of 16-bit halves their memory."
    example: "`--kv-cache-dtype fp8` in vLLM."
  - term: "Latency"
    def: "how long someone waits."
    example: "time to the first token."
  - term: "Layer"
    def: "one of the stacked processing stages each token passes through; each keeps its own notes."
    example: "32 in an 8B model, 80 in a 70B."
  - term: "Llama 3.1 8B, Llama 3 70B"
    def: "the open models used in the lessons and videos, with 8 and 70 billion parameters."
    example: "4.9 GB at 4-bit for the 8B."
  - term: "llama.cpp"
    def: "the open-source engine used on the Mac; `llama-server` answers requests, `llama-bench` times the engine alone."
    example: "Day 2's server."
  - term: "Localhost"
    def: "your own computer, used as an address."
    example: "`http://localhost:8080/v1` is llama.cpp on your Mac."
  - term: "make"
    def: "a tool that runs named shortcuts listed in a file called `Makefile`."
    example: "`make check` lists which servers are up."
  - term: "Max model length (--max-model-len)"
    def: "vLLM's limit on how many tokens one conversation may hold, which caps that conversation's notes."
    example: "`--max-model-len 8192`."
  - term: "Metal"
    def: "Apple's way for programs to use the Mac's GPU."
    example: "`brew install llama.cpp` gets a Metal build, with no CUDA."
  - term: "MiB"
    def: "1,048,576 bytes (about a million), the unit llama.cpp prints; 1,000 MiB is about 1 GB."
    example: "8,704 MiB = 9.13 GB."
  - term: "MLX"
    def: "Apple's own software for running and training models on Apple chips; `mlx_lm.server` is its model server."
    example: "port 8081; the same library fine-tunes a model on Day 8."
  - term: "ms (millisecond)"
    def: "a thousandth of a second."
    example: "500 ms is half a second."
  - term: "Notes"
    def: "this course's plain word for the KV cache."
    example: "128 KB of notes per token for Llama 3.1 8B."
  - term: "NVIDIA"
    def: "the company whose GPUs run most data-center AI."
    example: "vLLM and SGLang need an NVIDIA GPU."
  - term: "Observability"
    def: "seeing what a live service is doing, such as speed, errors and memory, while it runs."
    example: "llama.cpp's `--metrics` flag publishes live counters at `/metrics`."
  - term: "Offload (-ngl)"
    def: "choosing how many of the model's layers run on the GPU; the rest run on the slower CPU."
    example: "`-ngl 99` puts every layer on the GPU."
  - term: "Ollama"
    def: "a one-command model server built on llama.cpp that chooses most settings for you."
    example: "`ollama serve` answers on port 11434."
  - term: "OpenAI-compatible API"
    def: "the request format OpenAI made popular, which most model servers accept, so one client works with all of them."
    example: "Ollama, llama.cpp, MLX, vLLM and SGLang all speak it."
  - term: "p50 (median)"
    def: "the middle value: half the requests are faster, half slower."
    example: "`ttft_p50_ms` in the comparison table."
  - term: "p95"
    def: "the value 95 out of 100 requests stay under."
    example: "95 of 100 prompts under 3,000 tokens."
  - term: "PagedAttention"
    def: "vLLM's way of handing out note memory in small pages as a conversation grows, instead of reserving the maximum."
    example: "2 to 4 times more users (The KV Cache video)."
  - term: "Parameters (8B, 70B)"
    def: "the model's learned numbers (weights)."
    example: "8B = 8 billion."
  - term: "pip, wheel"
    def: "pip installs Python packages; a wheel is a ready-built package file."
    example: "a prebuilt wheel can expect a different CUDA than the machine has."
  - term: "Port"
    def: "a numbered door on a computer where one server program listens for requests."
    example: "Ollama 11434, llama.cpp 8080, MLX 8081."
  - term: "Prefill"
    def: "the reading phase; the model reads the whole prompt at once."
    example: "`pp512`."
  - term: "Prefix caching (prompt caching)"
    def: "the server keeps its notes on a prompt's opening and reuses them when the next request starts the same way."
    example: "`--enable-prefix-caching` in vLLM."
  - term: "Prompt"
    def: "the text you send the model."
    example: "a 3,000-token support question."
  - term: "Q8_0, Q4_K_M, Q3_K_M"
    def: "llama.cpp's weight formats at about 8.5, 4.8 and 3.9 bits per number."
    example: "8.5, 4.9 and 4.0 GB for an 8B model."
  - term: "Quantization (quantize)"
    def: "storing numbers with fewer bits."
    example: "16 to 8 to 4 bits, like saving a photo at lower quality."
  - term: "Request"
    def: "one message sent to the model for an answer."
    example: "95 of 100 requests under 3,000 tokens."
  - term: "Scheduler"
    def: "the part of a server that decides which requests share the chip at each step."
    example: "vLLM's scheduler swaps requests in and out at every step."
  - term: "Server"
    def: "a program that waits for requests and answers them."
    example: "llama.cpp's `llama-server`."
  - term: "Session"
    def: "one conversation."
    example: "an 8K session holds up to 8,192 tokens."
  - term: "SGLang"
    def: "a fast open-source server for NVIDIA GPUs that reuses shared prompt openings."
    example: "it runs in Day 9's optional Spark step."
  - term: "Slot"
    def: "one seat on the server, a conversation it can serve at the same time."
    example: "`--parallel 8` gives 8."
  - term: "Startup log"
    def: "the lines a server prints as it starts, including how much memory it set aside."
    example: "vLLM's shows 8.4 GB of weights and 8,234 blocks."
  - term: "Terminal"
    def: "the window where you type commands."
    example: "Day 2 uses four at once: one per server, plus one to compare."
  - term: "Throughput"
    def: "total output across everyone at once."
    example: "275.1 tokens/s with 8 people."
  - term: "Token"
    def: "a chunk of text, about three quarters of a word."
    example: "1,000 tokens is roughly 750 words."
  - term: "Tokens per second (tok/s)"
    def: "how many tokens are written each second."
    example: "38.9 per person with 8 people."
  - term: "TTFT (time to first token)"
    def: "how long until the first token (word piece) of the reply appears."
    example: "41.4 ms (p95) at 8 people."
  - term: "Virtual environment (venv)"
    def: "a private folder of Python packages for one project, turned on with `source .venv/bin/activate`."
    example: "`mlx_lm.server` and `felab` live inside it."
  - term: "vLLM"
    def: "an open-source engine for NVIDIA GPUs built for many users at once."
    example: "it uses PagedAttention."
  - term: "Warm-up request"
    def: "one request sent first and never counted, so loading the model does not skew the timings."
    example: "`bench_ttft.py` sends 'Say hi.' to each server before its 5 timed requests."
  - term: "Weights"
    def: "the model's learned numbers, fetched in full for every token written (a mixture-of-experts model fetches only the part it uses)."
    example: "4.9 GB for Llama 3.1 8B at 4-bit."
