#   448 x 0.1 = 44.80; 448 x 0.9 / 2 = 201.60; 44.80 + 201.60 = 246.40; 246.40 + 36 = 282.40; 120 / 8 x 1.2 = 18;
#   18 x 8 x 730 = 105,120; 105,120 / 282.40 = 372.2; 372.2 x 2e6 = 744.5 million (memo prints 744,475,921).
