#   0.216, 1.6 x 0.15 = 0.24, 0.456 + 2.40 = 2.856, x 30.42 = 86.87; 5,840 / 86.87 = 67.2; 5,840 x 1.5 = 8,760;
#   8,760 / 146 = 60; 8,760 / 86.87 = 100.8; 6.00 / 0.20 = 30; 5,840 / 6.00 = 973.3; 973.3 / 30.42 = 32.0;
