# Day 3 · Benchmark like a field engineer. Plain-language content for the guided course.
# Every number traces to a kit file (paths relative to the kit root):
#   L03     03-labs/lessons/03-concurrency-sweep/README.md lines 8-12 (knee, capacity), 36-42 (Run),
#           48-52 (practice table), 57-59 (checks), 63-65 (say)
#   sweep   .../03-concurrency-sweep/sweep.py lines 36 (13-word prompt, 80-word reply), 45-53 (columns),
#           65 (3 requests per person, at least 12), 72-77 (capacity line), 84-87 (levels 1..32,
#           promise default 1000 ms, 128 tokens out)
#   plot    .../03-concurrency-sweep/plot_sweep.py lines 16, 26-37 (text fallback), 43-47 (solid, dashed, red dotted)
#   mock    03-labs/felab/mock_server.py lines 31 (8 slots, 18 ms per step), 50 (4 characters per token),
#           207-210 (each extra user adds 6%)
#   measure 03-labs/felab/measure.py lines 34-46 (per-user speed = 1000 / median gap; nearest-rank percentile)
#   serve   03-labs/lessons/02-three-local-servers/serve_llamacpp.sh lines 9-10 (context split), 17-22
#   check   03-labs/lessons/00-setup/check_env.py lines 29-32 (ceiling = bandwidth / 4.9 GB); felab/hardware.py 20-27
#   memo    03-labs/lessons/15-capstone/build_memo.py lines 39 (1000 ms default), 55-60 (ceil(peak / per replica x 1.2))
#   L04     03-labs/lessons/04-quantization/README.md lines 17-18, 50 (8.5 and 4.9 GB, 111.4 ceiling, 86 tok/s, 77%)
#   kv      03-labs/lessons/05-kv-cache/kv_calc.py --ctx 32768 --free-gb 20 (4, then 8 with q8_0; Day 4 sheet)
#   narr    04-video-source/src/narration.json: benchmarking 1230-1384 (worked table 1301-1330, mean vs p95
#           1333-1362, recap 1365-1374); batching 555-685 (chunked prefill 587, worked 607-631, before/after
#           633-663); gpu-bandwidth 291-420 (989 TFLOPS 311, ceiling 316, 60-85% 338, worked 341-370, desktop 372-398)
#   FG      02-lab-book/inference-field-guide.html lines 628 (three quarters of a word per token), 733 and 1143
#           (H100 ridge about 300), 1581 (batching lengths 6,2,9,3,4,8,2,5,7,3,6,4 on 4 slots)
#   LB      02-lab-book/field-engineer-lab-book.html lines 539 (bring a benchmark with the traffic profile),
#           1763 (plan day 3: check the sweep against the ceiling formula)
#   KR      kit README.md lines 34-35 (venv, requirements), 153-154 (connection refused)
# Arithmetic: 275.1 / 54.1 = 5.09; 294.3 / 275.1 = 1.07; 3,357 / 41.4 = 81.1; 38.9 / 54.9 = 0.71; 16 / 54.9 = 0.29;
#   18 x (1 + 0.06 x 7) = 25.56 ms; 1000 / 18 = 55.6; 1000 / 25.56 = 39.1; 120 / 8 = 15; 15 x 1.2 = 18;
#   16,384 / 8 = 2,048; 8,192 / 4 = 2,048; 2,048 x 0.75 = 1,536; 8.5 - 4.9 = 3.6; 1,024 x 0.75 = 768;
#   256 x 0.75 = 192; 264 / 24 = 11; 228 / 135 = 1.69; 264 / 228 = 1.16; 228 / 16 = 14.25; 1,850 / 380 = 4.87;
#   1,850 / 1,000 = 1.85; 6+2+9+3+4+8+2+5+7+3+6+4 = 59; 59 / (4 x 24) = 0.615; 59 / (4 x 17) = 0.868;
#   24 / 17 = 1.41; 17 / 24 = 0.71; 2.8 / 0.40 = 7; 100,000 x 0.75 = 75,000; 3,350 / 70 = 47.9;
#   4,800 / 70 = 68.6; 8,000 / 70 = 114.3; 100 x 70 = 7,000; 3,350 / 35 = 95.7; 3,350 / 38 = 88.2;
#   114.3 x 0.6 = 68.6; 114.3 x 0.85 = 97.1; 273 / 4.5 = 60.7; 38.7 / 60.7 = 0.64; 273 / 4.9 = 55.7;
#   546 / 4.9 = 111.4; 86 / 111.4 = 0.77; 989 / 3.35 = 295; 100 x 0.75 = 75; 13 words / 0.75 = 17 tokens
#   (12 words plus the #<n> tag; the practice server's 4-characters rule gives 15 to 17 for the 60 to
#   70-character prompts); 8,000 / 35 = 228.6, about 229; 229 x 0.6 = 137; 229 x 0.85 = 195;
#   48 requests at C=16: nearest-rank p95 is the 46th of 48 (2 waited longer).
#   README line 19 has U+25B6 (counts as an emoji): replaced on the page with ">".

day: 3
tile: "Find how many people one server handles before everyone starts waiting"

overview:
  today: "Find out how many people one server can serve at once before newcomers start waiting. Test the kit's practice server first, then the real model on your Mac. Then check your Mac against one formula: the fastest it can write for one person = memory speed (GB per second) ÷ model size (GB)."
  example: "Imagine eight customers asking a support bot for help at once. The practice server has eight places, so all eight can start. When sixteen customers arrive together, half must wait for a place; some wait over three seconds before a reply even starts. Today you will find the crowd size where that wait becomes unacceptable, so you know when one server is no longer enough."
  deliverable: "A chart of total output and first-token wait at each crowd size, for both servers, labelled with the test conditions."
  expected: "The practice server keeps its promise to start most replies within half a second up to 8 people at once. At 16, some people have to wait for a free place. Your Mac test shows where the same crowding begins on a real model."
  before:
    - title: "The practice server is running."
      body: "Today's first test talks to the kit's practice server: a stand-in that behaves like a real server, with 8 seats (it serves 8 conversations at a time) and made-up numbers. From the `03-labs` folder, with the Python environment on (`source .venv/bin/activate`), start it in the background (it keeps running while you type other commands):"
      command: "make mock &"
      after: "It prints a line with `slots=8`, its 8 seats. If it says the address is already in use, it is still running from an earlier day: that is fine."
    - title: "Day 2's llama.cpp server is stopped."
      body: "Today's step restarts llama.cpp with 8 seats. It uses the model file Day 2 downloaded (Llama 3.1 8B, a model of 8 billion numbers, stored at 4 bits: 4.9 GB), so nothing new downloads today. If Day 2's server is still running, press Ctrl+C in its terminal. The new one needs the same port (the numbered door a server listens on), 8080."
    - title: "Your Mac's speed limit, written down."
      body: "The kit's check script prints your Mac's memory speed and the top writing speed it allows for today's 4.9 GB model. You compare your measured speed with it at the end of the step."
      command: "make check"
      after: "Look for the `bandwidth` line: for example `~273 GB/s` (memory speed, GB per second) and `~56 tok/s` (the top writing speed, tokens per second) on an M4 Pro Mac. The `mock` line should say UP."
  feeds: "A customer deciding how many servers to run needs this crowd-size result, with your test conditions written down. On Day 10 your sizing memo uses it to estimate server count and adds room for traffic spikes."

steps:
  d3-s1:
    why: "You measure how many people one server can serve at once before the wait for a reply to start passes the promised limit. That number, not a single speed figure, decides how many servers a customer needs."
    why_example: "Example: on the kit's practice server (a stand-in with made-up numbers), 95 of 100 requests from 8 people at once get their first token (word piece) within 41.4 ms, thousandths of a second. At 16 people that wait jumps to 3,357 ms, over 3 seconds."
    videos:
      10-benchmarking:
        in_this_video: "Why one speed number misleads, and the table a field engineer hands a customer instead."
        key_points:
          - point: "Write down the traffic before you test anything."
            detail: "Four lines: tokens in, tokens out, requests per second, and the speed promise with its percentile (for example p95: the wait 95 out of 100 requests stay under). The video's example: 1,024 tokens in and 256 out per request, tested with 200 requests at each crowd size."
          - point: "Test at 1, 2, 4, 8, 16 and 32 people at once, and report the curve, not one number."
            detail: "In the video's table, total output climbs from 24 to 264 tokens per second (11 times). Meanwhile the p95 wait for the first token (95 of 100 wait less) grows from 210 ms to 1,850 ms."
          - point: "The answer is the biggest crowd whose p95 wait stays under the promise. The average hides the problem."
            detail: "With a 1-second promise the video sizes at 16 people (720 ms). From 8 to 32 people the average wait only went from 290 to 410 ms, while the p95 went from 380 to 1,850 ms, almost 5 times. An average-only report would have called 32 people fine."
      05-batching:
        in_this_video: "Three ways a server keeps its expensive chip busy: continuous batching, chunked prefill and speculative decoding."
        key_points:
          - point: "Continuous batching gives a free seat to the next request the moment a reply finishes, instead of waiting for the whole group."
            detail: "The video's 12 requests on 4 seats: the chip is busy 87% of the time instead of 61%. All the work is done at step 17 instead of 24 (each step writes one token for every busy seat)."
          - point: "Chunked prefill reads one huge prompt in pieces, so it cannot freeze everyone else's replies."
            detail: "The video's example is a 100,000-token prompt (about 75,000 words), read in chunks between other people's writing steps. That prompt's first token comes a little later; everyone else's reply keeps appearing word by word."
          - point: "Speculative decoding cuts waiting: a small model drafts a few tokens and the big model checks them all in one pass, so the output does not change."
            detail: "Day 9 comes back to it. The video's real case stacks three fixes (reusing a repeated prompt, chunked prefill, speculation) on the same 2 GPUs (the chips that run the model). The p95 wait for the first token fell from 2.8 s to 0.40 s, 7 times faster. The p95 gap between tokens fell from 48 to 26 ms, the part speculation speeds up."
      03-gpu-bandwidth:
        in_this_video: "Why one person's writing speed is set by how fast memory delivers the model, and how to predict it on any chip."
        key_points:
          - point: "Top writing speed for one person = memory speed ÷ model size."
            detail: "Each token needs the whole model fetched once. A 70-billion-number model at 8 bits (1 byte per number) is 70 GB. An H100 (NVIDIA's data-center GPU) fetches 3,350 GB a second: 3,350 ÷ 70 = about 48 tokens per second."
          - point: "Real dense models (ones that use every number for each token) reach about 60 to 85% of that limit."
            detail: "The video's DGX Spark (NVIDIA's desktop AI computer) moves 273 GB a second. For an 8-billion-number model at 4 bits, which the video counts as 4.5 GB, the limit is 273 ÷ 4.5 = 61 tokens per second. It measured 38.7: 64% of the limit. Today's 4-bit file is 4.9 GB, which gives 273 ÷ 4.9 = 56."
          - point: "Batching is how you put the chip's idle math to work."
            detail: "An H100 can do about 989 trillion calculations a second but fetch only 3,350 GB a second: about 300 calculations per byte (989 ÷ 3.35 = 295). Serving one person needs only about 2 per number fetched, so the math sits idle. Serving many people from each fetch puts it to work."
    plain:
      lead: "To write each word piece, the server reads the whole model from memory once, and it shares that read among everyone it is serving. So extra people cost little until its seats are full. After that, newcomers wait in line and the wait for the first token jumps. That jump is the knee. The biggest crowd before it is one server's capacity."
      picture: "A bus takes about as long to drive its route with 1 rider as with 8, so filling seats is nearly free. Once every seat is taken, the next riders wait at the stop, however fast the bus drives. Count the most riders one bus takes with nobody waiting too long. Divide the rush-hour crowd by it to know how many buses to run."
      numbers_source: "lesson 03's practice server: 8 seats, a 500 ms promise, realistic behaviour with made-up numbers"
      numbers:
        - "1 person: 54.1 tokens (word pieces) per second in total. 95 of 100 get their first token within 27.4 ms (thousandths of a second)."
        - "8 people: 275.1 in total, 5 times as much (275.1 ÷ 54.1 = 5.1). Each person still gets 38.9 per second, and 95 of 100 get their first token within 41.4 ms."
        - "16 people: 294.3 in total, only 7% more than at 8. Now 8 people wait for a seat. 95 of 100 get their first token within 3,357 ms (over 3 seconds), 81 times longer (3,357 ÷ 41.4 = 81)."
        - "So one copy of the server (a replica) holds 8 people within the 500 ms promise."
        - "If the busiest moment brings 120 people at once (the lesson's example): 120 ÷ 8 = 15 copies, plus spare ones."
      words:
        - term: "Batching"
          def: "serving several people with one pass over the model. Example: 8 people share each fetch of the model."
        - term: "TTFT (time to first token)"
          def: "how long until the first token of the reply appears. Example: 41.4 ms (p95) at 8 people."
        - term: "p95"
          def: "the value 95 out of 100 requests stay under; the slowest 5 are the tail. Example: 3,357 ms at 16 people."
        - term: "Goodput"
          def: "requests per second that kept the promise; late ones do not count. Example: 2.5 per second at 8 people, 0.4 at 16."
    run:
      - cmd: "python sweep.py --target mock --slo-ms 500"
        note: "Tests the practice server at 1, 2, 4, 8, 16 and 32 people at once. The promise: 95 of 100 first tokens within 500 ms (half a second). Each crowd size sends 3 requests per person, and at least 12 in all. **Look for** the line starting `Capacity line:` near the end. It says `holds up to C=8` (C is people at once): the practice server's 8 seats."
      - cmd: "python plot_sweep.py && open ../../results/03-sweep.png"
        note: "Draws the chart and opens it. Total output is the solid line (left scale). The p95 wait for the first token is the dashed line (right scale). The promise is the red dotted line. **Look for** the dashed line leaping after 8 while the solid line flattens."
      - cmd: "bash ../02-three-local-servers/serve_llamacpp.sh Q4_K_M 16384 8"
        note: "Restarts llama.cpp, Day 2's real server (the program that runs the model on your Mac), with the same 4-bit model file (Q4_K_M) and 8 seats (slots). Its room for conversations, 16,384 tokens, is split across the seats: 2,048 each, the same as Day 2's 8,192 over 4. It keeps its terminal busy. Open a second terminal, `cd` into the kit's `03-labs/lessons/03-concurrency-sweep` folder (the `../02-three-local-servers` path only works from there), then run it and leave it running. **Look for** `ctx=16384` and `slots=8` on its first line."
      - cmd: "python sweep.py --target llamacpp --levels 1,2,4,8,16"
        note: "The same test against the real model on your Mac, from 1 to 16 people. With no `--slo-ms`, it judges against the script's default promise, 1,000 ms (1 second), which is also the Day 10 sizing memo's default. **Look for** `ttft_p95` jumping between the 8 and 16 rows, and the `Capacity line:` near the end."
      - cmd: "python plot_sweep.py"
        note: "Redraws the chart with the practice run and your Mac's run on the same axes, and saves it again to `results/03-sweep.png` (open it as before). The red promise line now shows your Mac run's promise. **Look for** the same shape on your Mac: output flattens and the wait jumps once all 8 seats are busy."
    see: "Your practice run prints six rows, 1 to 32 people at once (`conc`); the lesson shows three. Read across: total output (`agg_tok_s`), one person's speed (`user_tok_s`), the first-token wait in ms, typical (`ttft_p50`) and 95 of 100 (`ttft_p95`), and requests per second that kept the promise (`goodput_rps`). From 1 to 8 people, output grows 5 times while the p95 wait only moves from 27.4 to 41.4 ms. At 16, output barely grows, the wait jumps to 3,357 ms and goodput falls from 2.5 to 0.4. That jump is the knee."
    checks:
      - q: "When 8 people used the practice server at once instead of 1, its total output rose about 5 times. Yet each person's reply only slowed from 55 to 39 tokens (word pieces) per second. Why does sharing cost so little?"
        plain: "To write each token, the chip must fetch the whole model from memory, and that fetch is the slow part. One fetch serves all 8 people at once, so each extra person adds only a little."
        picture: "A bus takes about the same time to drive its route with 1 rider or with 8. The drive is the slow part; letting a few more people on adds a little time at each stop. This stops working once the seats run out: then extra riders wait for the next bus, and that point is the knee."
        numbers_source: "lesson 03's practice server: it behaves like a real one, but its numbers are made up for teaching"
        numbers:
          - "1 person alone: 54.1 tokens per second in total; that person sees about 55 (54.9) once the reply is flowing."
          - "8 people: 275.1 in total, about 5 times the 54.1 (275.1 ÷ 54.1 = 5.1)."
          - "Each person: 54.9 falls to 38.9 tokens per second, 29% slower."
          - "So each person keeps 71% of their solo speed while the server does 5 times the work."
        words:
          - term: "Decode"
            def: "the writing phase; the model writes one token at a time and fetches the whole model for each. Example: 54.9 tokens per second for one person on the practice server."
          - term: "Memory-bound"
            def: "slowed by how fast memory delivers data, not by how fast the chip calculates. Example: decode."
          - term: "Batching"
            def: "serving several people with one pass over the model. Example: 8 people share each fetch."
          - term: "Tokens per second (tok/s)"
            def: "how many tokens are written each second. Example: 38.9 per person with 8 people."
        more: "Each decode step streams all the weights once, whatever the batch size. Each extra user still adds its own KV-cache reads and a little compute, which is why per-user speed falls somewhat (54.9 to 38.9). The practice server builds this in on purpose: one step takes 18 ms alone and grows 6% per extra user, so 18 x 1.42 = 25.6 ms with 8. That is 1,000 ÷ 18 = 55.6 tokens per second alone and 1,000 ÷ 25.56 = 39.1 with 8 (`felab/mock_server.py`, `_itl`). In roofline terms, one user's decode does about 1 to 2 calculations per byte fetched, while an H100 needs about 300 to keep its math busy; batching raises that ratio. The 1-user total (54.1) sits a little under the per-user figure (54.9) because the per-user figure is the median speed once text starts flowing, while the total divides all tokens by wall-clock time, which includes the wait before the first token."
      - q: "At the busiest moment, 120 people use the service at once. One copy of the server (a replica) handles 8 people while still keeping its speed promise (the SLO). How many copies do you need?"
        plain: "120 ÷ 8 = 15 copies covers the busiest moment exactly. Add spare copies for surprises, so plan for about 18."
        picture: "A ride seats 8 per car, and 120 people want to ride at the same moment. You need 15 cars, plus a few spare in case one breaks down or a bigger crowd shows up."
        numbers_source: "lesson 03, and the rule in the Day 10 sizing memo"
        numbers:
          - "Busiest moment: 120 people at once."
          - "One copy keeps its promise up to 8 people (the practice server's limit)."
          - "120 ÷ 8 = 15 copies."
          - "The lesson's answer, 18, adds 3 spare copies: 20% extra (15 x 1.2 = 18). The Day 10 sizing memo adds the same 20%."
        words:
          - term: "Replica"
            def: "one complete running copy of the server and model. Example: 18 replicas for 120 people."
          - term: "SLO (service level objective)"
            def: "the speed promise. Example: 95 of 100 requests get their first token within 500 ms (half a second)."
          - term: "Peak traffic"
            def: "the most people using the service at the same moment. Example: 120."
          - term: "Headroom"
            def: "spare capacity kept for surprises. Example: plan 18 where 15 are needed."
        more: "Replicas = peak concurrency ÷ per-replica capacity at the SLO, rounded up, plus headroom for traffic spikes, a replica restarting and forecast error. Lesson 15's `build_memo.py` computes exactly this, `math.ceil(a.peak_concurrency / per_replica * 1.2)`: 120 ÷ 8 x 1.2 = 18. Measure the per-replica capacity with the customer's real prompt and reply lengths, because longer contexts move the knee."
      - q: "On the sweep chart, the knee is the point where all the server's seats are taken and new people start waiting in line. What moves that point?"
        plain: "The knee moves to more people when more fit at once: more seats, more memory set aside for the notes (the KV cache), a smaller model, or shorter conversations. It moves to fewer people when one long prompt hogs the chip while it is read."
        picture: "A restaurant is full at a certain number of guests. More tables, more floor space or shorter meals seat more people; one huge order hogging the kitchen slows every other table."
        numbers_source: "lesson 03's practice server and llama.cpp settings, and lessons 04 and 05 (Day 4)"
        numbers:
          - "Practice server: 8 seats, so the knee comes right after 8 people."
          - "At 8 people, 95 of 100 got their first token within 41.4 ms (thousandths of a second); at 16, within 3,357 ms (over 3 seconds): about 80 times longer."
          - "Seats share memory: llama.cpp splits 16,384 tokens of conversation room across 8 seats, 2,048 tokens (about 1,500 words) each. More seats means less room for each conversation."
          - "Memory for notes sets the seats. Day 4's calculator: 20 GB of spare memory holds 4 conversations of 32,768 tokens (about 25,000 words) with notes at 16 bits per number, and 8 at 8 bits."
          - "A smaller model frees memory: Llama 3.1 8B at 4 bits is 4.9 GB against 8.5 GB at 8 bits, 3.6 GB more for notes (Day 4)."
        words:
          - term: "Knee"
            def: "the point where seats run out and waiting time shoots up. Example: after 8 people on the practice server."
          - term: "Slot"
            def: "one seat on the server, a conversation it can serve at the same time. Example: the practice server has 8."
          - term: "Notes (KV cache)"
            def: "the model's memory of each conversation so far, kept in the same memory as the model. Example: 4 conversations of 32,768 tokens fit in 20 GB."
          - term: "Prefill"
            def: "the reading phase; the model reads the whole prompt at once before writing. Example: a 100,000-token prompt takes a long prefill."
        more: "In llama.cpp the `-c` context is split across the `--parallel` slots (the comment in `serve_llamacpp.sh` says so), so slots and context length trade off directly. A quantized model frees memory for KV cache and also makes each decode step faster. Long prefills stall the decode steps of everyone batched with them; chunked prefill (Batching & Scheduling video) is the usual fix. The 41.4 and 3,357 ms figures are TTFT p95."
    say:
      ask: "The vendor's benchmark says this GPU is fast. How many of them do we need for launch?"
      means:
        - phrase: "Single-stream numbers sell hardware"
          meaning: "a speed measured with one person at a time makes a chip look good in a brochure, but says nothing about a crowd. Example: the practice server's 54.9 tokens per second for one person."
        - phrase: "concurrency curves size deployments"
          meaning: "how many servers to buy comes from a chart of output and waiting time at 1, 2, 4, 8 and 16 people at once."
        - phrase: "I sweep"
          meaning: "I run the same test at each crowd size in turn, with the customer's own prompt and reply lengths."
        - phrase: "find the highest concurrency that holds p95 TTFT under the SLO"
          meaning: "I find the biggest crowd at which 95 of 100 people still get their first token within the promised time. Practice server: 8 people, 41.4 ms against a 500 ms promise; at 16 it is 3,357 ms."
        - phrase: "and size replicas from peak traffic divided by that"
          meaning: "copies of the server needed = the most people at once ÷ people per copy. 120 ÷ 8 = 15, plus 20% spare = 18."
    fields:
      - id: d3-profile
        label: "Test conditions (traffic profile) to write above your chart"
        hint: "From the sweep's settings: a 12-word prompt plus a number tag (about 17 tokens of text) in, up to 128 tokens out, 1 to 16 people at once, 3 requests per person, and the promise (1,000 ms unless you set `--slo-ms`)."
        meaning: "The conditions your curve was measured under. Without them a speed number means nothing, because longer prompts or replies move the knee. The sweep fixes how many people are served at once instead of a rate of requests per second, so write the crowd sizes. The server also wraps each prompt in a few tokens of its own."
        example: "about 17 in / up to 128 out · 1 to 16 at once · p95 first token within 1 s"
      - id: d3-capacity
        label: "People one copy of the server holds within the promise (your Mac)"
        hint: "The Capacity line after the llama.cpp sweep, for example `holds up to C=8`. Write the number of people; the promise is 1,000 ms unless you set `--slo-ms`."
        unit: "people"
        meaning: "One server's capacity. Divide the busiest moment's crowd by it to get how many copies to run."
        example: "Practice server: 8 people within 500 ms, so 120 people need 120 ÷ 8 = 15 copies, 18 with spares."
      - id: d3-total-output
        label: "Total output: 1 person, and at your capacity (your Mac)"
        hint: "The `agg_tok_s` column of the llama.cpp sweep: the 1 row and your capacity row. Write both, for example 54.1 / 275.1."
        unit: "tok/s"
        meaning: "How much the server writes for everyone together. Sharing each pass over the model should multiply it several times before the seats fill."
        example: "Practice server: 54.1 alone, 275.1 at 8 people, 5 times as much."
      - id: d3-per-person
        label: "Speed each person sees: alone, and at your capacity (your Mac)"
        hint: "The `user_tok_s` column, the same two rows. Write both, for example 54.9 / 38.9."
        unit: "tok/s"
        meaning: "How fast one reply appears. It falls only a little as people share the server, because fetching the model is the slow part."
        example: "Practice server: 54.9 alone, 38.9 at 8 people, 29% slower."
      - id: d3-ceiling-share
        label: "Your speed alone as a share of your Mac's speed limit"
        hint: "Divide `user_tok_s` at 1 person (llama.cpp run) by the limit `make check` prints on its bandwidth line (about 56 tok/s on an M4 Pro), then multiply by 100. Expect 60 to 85%. M3 Max and M4 Max chips come in two memory speeds and `make check` assumes the faster one, so a low share may mean you have the slower one."
        unit: "%"
        meaning: "The speed limit is memory speed ÷ model size (4.9 GB today). Landing at 60 to 85% of it means your measurement makes sense."
        example: "An M4 Max Mac (546 GB/s) has a limit of 546 ÷ 4.9 = 111 tok/s. Day 4's sample figures reach 86: 86 ÷ 111 = 0.77, so 77%."
    done: "The practice run prints `holds up to C=8`, and `results/03-sweep.png` shows both runs, practice and your Mac. You have written its test conditions in Your numbers: tokens in, tokens out, people at once and the promise."
    stuck:
      - problem: "The first sweep stops with `Connection refused` (or `Connection error`)."
        fix: "The practice server is not running. From the `03-labs` folder, with the Python environment on, run `make mock &`, then run the sweep again. `make check` shows which servers are up."
      - problem: "The llama.cpp sweep stops with `Connection refused` (or `Connection error`)."
        fix: "llama.cpp is not running yet, or is still loading the model. Start it in its own terminal with the `serve_llamacpp.sh` line above and wait until it says it is listening. `make check` shows `llamacpp` as UP when it is ready."
      - problem: "`serve_llamacpp.sh` says `No such file or directory`."
        fix: "The new terminal is in the wrong folder. `cd` into the kit's `03-labs/lessons/03-concurrency-sweep` folder and run the line again."
      - problem: "Your Mac's chart jumps after 4 people, not 8."
        fix: "llama.cpp started with Day 2's 4 seats. Its first line must say `slots=8`: stop it with Ctrl+C and start it again with `Q4_K_M 16384 8` at the end."
      - problem: "`plot_sweep.py` prints a text chart, then `open` says `03-sweep.png` does not exist."
        fix: "The chart library (matplotlib) is missing, so the script falls back to text. In the `03-labs` folder run `source .venv/bin/activate`, then `pip install -r requirements.txt`, then plot again."
      - problem: "`plot_sweep.py` says `No results yet`."
        fix: "Run a sweep first. Every sweep adds its rows to `03-labs/results/03-sweep.csv`, wherever you run it from, and the chart reads them from there."
    replace:
      - find: "\u25B6 concurrent users"
        with: "> concurrent users"

wrapup:
  done: "You have a chart of total output and first-token wait at each crowd size, for the practice server and your Mac, with its test conditions written down. You also know how many people one copy of the server holds within the promise."
  whiteboards:
    - video: "10-benchmarking"
      q: "You tested a server at 1, 4, 8, 16 and 32 people at once. Each request sends 1,024 tokens (about 770 words) and gets 256 back (about 190 words), with 200 requests per crowd size. The promise: 95 of 100 people see the first token within 1 second. How many people can one server take?"
      given: "The results, one row per crowd size: total output in tokens per second, then the p95 wait for the first token. 1 person: 24, 210 ms. 4 people: 78, 260 ms. 8: 135, 380 ms. 16: 228, 720 ms. 32: 264, 1,850 ms."
      plain: "16 people per server. At 16, 95 of 100 still see the first token within 720 ms, under the 1-second promise; at 32 it is 1,850 ms, almost twice the promise."
      picture: "A kitchen sends out more plates per hour as tables fill, but the wait for the first course grows. Its capacity is the most tables at which nearly every table is still served on time. It is not the most plates the kitchen can ever cook."
      steps:
        - "The promise: 95 of 100 people see the first token within 1,000 ms (1 second)."
        - "Read down the p95 column: 210, 260, 380 and 720 ms all keep the promise."
        - "At 32 people it is 1,850 ms: 1.85 times the promise, so 32 is too many."
        - "The last tested size that keeps it is 16, so size one server at 16 people. The exact crowd where the wait passes 1 second lies somewhere between 16 and 32; it was not tested."
        - "Total output there: 228 tokens per second, or 228 ÷ 16 = about 14 per person, against 24 for one person alone."
        - "The curve is flattening: output rose 69% from 8 to 16 people (135 to 228), but only 16% from 16 to 32 (228 to 264)."
      note: "The narration says the p95 crosses 1 second 'somewhere between eight and sixteen'. The table says between 16 and 32 (720 ms at 16, 1,850 ms at 32), and the on-screen answer agrees: size at 16."
      kit_q: "Worked example · the table you produce · 1,024 in / 256 out · 200 prompts per point"
      kit_a: "Size at concurrency 16: 228 tok/s inside a 1 s p95 budget"
      more: "Read the table from the bottom: throughput flattens past 16, and p95 TTFT crosses the 1 s budget between 16 and 32, so 16 is the highest measured concurrency under the SLO. To locate the crossing more precisely, add levels between 16 and 32 with `--levels`. The same video shows why the percentile matters: from c = 8 to c = 32 the mean TTFT only went from 290 to 410 ms, while the p95 went from 380 to 1,850 ms, so a mean-only report would call both fine. Lesson 03's `sweep.py` uses the same 1,000 ms budget by default."
      words:
        - term: "p95"
          def: "the value 95 out of 100 requests stay under. Example: 720 ms at 16 people."
        - term: "TTFT (time to first token)"
          def: "how long until the first token of the reply appears. Example: 210 ms (p95) for one person."
        - term: "Throughput"
          def: "total output across everyone at once. Example: 228 tokens per second at 16 people."
        - term: "Traffic profile"
          def: "the shape of the load a test uses: tokens in, tokens out, requests per second, and the speed promise. Example: 1,024 in, 256 out, first token within 1 s at p95."
    - video: "03-gpu-bandwidth"
      q: "A customer needs 100 tokens per second (about 75 words a second) for each person, on a model with 70 billion numbers (a 70B model). What hardware does that require?"
      given: "The model is stored at 8 bits (FP8): 1 byte per number, so 70 GB. Writing each token means fetching the whole model from memory once. Memory speeds of three NVIDIA data-center GPUs: H100 3,350 GB per second, H200 4,800, B200 8,000."
      plain: "It needs memory that delivers about 7,000 GB a second (100 x 70 GB). At 8 bits only a B200 (8,000) is above that, and only on paper: real speeds land lower. A B200 with the model at 4 bits (limit 229) clears 100 with room; an H100 at 4 bits (96) does not."
      picture: "A tank drains through one pipe. Each bucket is one token, and filling it takes the whole model: 70 litres. To fill 100 buckets every second, the pipe must carry 7,000 litres a second. A pipe that carries 3,350 fills only 48 buckets a second, however fast you work at the other end."
      steps:
        - "Model size: 70 billion numbers x 1 byte = 70 GB, fetched once per token."
        - "Memory speed needed: 100 tokens per second x 70 GB = 7,000 GB per second."
        - "H100: 3,350 ÷ 70 = 48 tokens per second, under half the need."
        - "H200: 4,800 ÷ 70 = 69. Still short."
        - "B200: 8,000 ÷ 70 = 114. Clears 100 on paper, by 14%."
        - "Or shrink the model to 4 bits, half a byte per number: 70 x 0.5 = 35 GB. An H100 then reaches 3,350 ÷ 35 = 96: close, but still under 100."
        - "These are upper limits. The same video says real models like this one reach 60 to 85% of them. For a B200 at 8 bits: 114 x 0.6 = 68 and 114 x 0.85 = 97. So expect 68 to 97 tokens per second: under 100."
        - "A B200 with the model at 4 bits: 8,000 ÷ 35 = 229. At 60 to 85% that is 229 x 0.6 = 137 to 229 x 0.85 = 195. That clears 100 with room. Measure before you promise 100."
      note: "The video calls B200 and 4-bit on an H100 'two ways to say yes'. By its own numbers, 4-bit on an H100 stays just under 100 (about 96), and both figures are upper limits, not measured speeds."
      kit_q: "A customer says they need one hundred tokens per second per user on a seventy billion parameter model. Turn that into a hardware requirement."
      kit_a: "B200 — or quantise to 4-bit and an H100 reaches ~96 tok/s"
      more: "Single-stream decode ceiling = memory bandwidth ÷ bytes read per token; the kit's `felab/hardware.py` uses the same formula and the same bandwidths (H100 SXM 3,350, H200 4,800, B200 8,000 GB/s). The requirement is per user, so batching does not help here: it raises total throughput while each user's speed falls a little (lesson 03's practice server: 54.9 to 38.9 tokens per second). The narration's own verdict for the H100 is 'not on an H one hundred, not at that precision'. Its 4-bit figure assumes 35 GB; the same video's desktop example uses 38 GB for a 70B at 4-bit (real 4-bit files carry shared scales), which gives 3,350 ÷ 38 = 88 tokens per second. All figures are for one GPU; splitting the model across GPUs (the Fitting Big Models video, Day 9) changes the arithmetic."
      words:
        - term: "Bandwidth (memory bandwidth)"
          def: "how many GB per second memory delivers to the chip. Example: H100 3,350 GB/s."
        - term: "Ceiling (speed limit)"
          def: "the fastest a model can write for one person: memory speed ÷ model size. Example: 3,350 ÷ 70 = 48 tokens/s."
        - term: "FP8"
          def: "an 8-bit number format, 1 byte per number. Example: a 70B model is 70 GB in FP8."
        - term: "H100, H200, B200"
          def: "three generations of NVIDIA's data-center GPUs, older to newer. Example: memory speeds of 3,350, 4,800 and 8,000 GB/s."

glossary:
  # New on Day 3
  - term: "Arithmetic intensity"
    def: "how many calculations the chip does for each byte it fetches from memory."
    example: "about 1 to 2 for one person's decode; an H100 needs about 300 to keep its math busy."
  - term: "B200"
    def: "NVIDIA's Blackwell data-center GPU, 192 GB of memory at 8,000 GB/s."
    example: "8,000 ÷ 70 = 114 tokens/s limit for a 70B model at 8 bits."
  - term: "Capacity (of one replica)"
    def: "the most people one copy of the server serves at once while keeping the speed promise."
    example: "8 on the practice server within 500 ms."
  - term: "Concurrency sweep"
    def: "the same test run at 1, 2, 4, 8, 16 and 32 people at once, then drawn as a curve."
    example: "lesson 03's `sweep.py`."
  - term: "FLOPS (floating-point operations per second)"
    def: "how many calculations on decimal numbers a chip can do each second; a teraflop is a trillion."
    example: "an H100 does about 989 trillion (989 teraflops)."
  - term: "matplotlib"
    def: "the Python library that draws the kit's charts."
    example: "without it, `plot_sweep.py` prints a text chart instead."
  - term: "Roofline"
    def: "a chart of a chip's top speed against arithmetic intensity: a sloped memory-bound part, then a flat compute-bound roof."
    example: "the GPU Bandwidth video's chart."
  - term: "Semaphore"
    def: "a counter in code that lets only a set number of tasks run at the same time."
    example: "`asyncio.Semaphore(8)` keeps at most 8 requests running at once."
  - term: "Single-stream"
    def: "one request at a time, with no one else sharing the server."
    example: "54.9 tokens/s for one person on the practice server."
  - term: "Static batching"
    def: "a fixed group of requests runs together, and the next group starts only when the longest one finishes."
    example: "12 requests on 4 seats finish at step 24, against 17 with continuous batching."
  - term: "Traffic profile"
    def: "the shape of the load a test uses: tokens in, tokens out, requests per second, and the speed promise with its percentile."
    example: "1,024 in, 256 out, first token within 1 s at p95 (the Benchmarking Properly video)."
  - term: "Wall-clock time"
    def: "the real time that passes from start to finish."
    example: "total output divides all tokens by it."
  - term: "Goodput"
    def: "the requests per second that met the speed promise; late ones do not count."
    example: "2.5 per second at 8 people on the practice server, 0.4 at 16."
  - term: "Percentile"
    def: "the value a given share of requests stay under: p50 is half of them, p95 is 95 of 100."
    example: "p95 TTFT of 41.4 ms at 8 people on the practice server."
  - term: "Queueing"
    def: "waiting in line for a free seat on the server."
    example: "at 16 people on the practice server, 8 wait."
  - term: "Speculative decoding"
    def: "a small draft model guesses several tokens and the big model checks them all in one pass; the output does not change."
    example: "Day 9 measures when it pays."
  # Shared with Day 1 (same text as day-01.yaml)
  - term: "CSV file"
    def: "a plain table file: one row per line, commas between the columns."
    example: "`results/01-latency.csv`."
  - term: "make"
    def: "a tool that runs named shortcuts listed in a file called `Makefile`."
    example: "`make smoke`, `make fw-check`."
  - term: "Tail (latency tail)"
    def: "the slowest few requests."
    example: "p95 describes the tail."
  # Shared with Days 1 and 2 (same text as day-01.yaml and day-02.yaml)
  - term: "CPU"
    def: "the computer's general-purpose processor, slower than the GPU for model math."
    example: "model layers not placed on the GPU run here."
  - term: "felab"
    def: "the kit's small shared Python toolkit that every lesson script imports."
    example: "`felab/targets.py` lists every server's address."
  - term: "p50 (median)"
    def: "the middle value: half the requests are faster, half slower."
    example: "`ttft_p50_ms` in the comparison table."
  - term: "pip, wheel"
    def: "pip installs Python packages; a wheel is a ready-built package file."
    example: "a prebuilt wheel can expect a different CUDA than the machine has."
  - term: "Port"
    def: "a numbered door on a computer where one server program listens for requests."
    example: "Ollama 11434, llama.cpp 8080, MLX 8081."
  - term: "Terminal"
    def: "the window where you type commands."
    example: "Day 2 uses four at once: one per server, plus one to compare."
  - term: "Virtual environment (venv)"
    def: "a private folder of Python packages for one project, turned on with `source .venv/bin/activate`."
    example: "`mlx_lm.server` and `felab` live inside it."
  # Shared with Day 2 (same text as day-02.yaml)
  - term: "Chunked prefill"
    def: "reading a long prompt in pieces, between other people's writing steps, so one long prompt does not freeze everyone else."
    example: "`--enable-chunked-prefill` in vLLM."
  - term: "Continuous batching"
    def: "letting requests join and leave the shared group at every writing step, instead of waiting for the whole group to finish."
    example: "a finished reply's seat is refilled at the next step, like a taxi rank rather than a tour bus."
  - term: "DGX Spark"
    def: "NVIDIA's desktop AI computer, with 128 GB of memory shared by its CPU and GPU."
    example: "about 273 GB/s of memory speed; Day 9's optional step runs vLLM and SGLang on it."
  - term: "NVIDIA"
    def: "the company whose GPUs run most data-center AI."
    example: "vLLM and SGLang need an NVIDIA GPU."
  - term: "vLLM"
    def: "an open-source engine for NVIDIA GPUs built for many users at once."
    example: "it uses PagedAttention."
  - term: "SGLang"
    def: "a fast open-source server for NVIDIA GPUs that reuses shared prompt openings."
    example: "it runs in Day 9's optional Spark step."
  - term: "MiB"
    def: "1,048,576 bytes (about a million), the unit llama.cpp prints; 1,000 MiB is about 1 GB."
    example: "8,704 MiB = 9.13 GB."
  - term: "Q8_0, Q4_K_M, Q3_K_M"
    def: "llama.cpp's weight formats at about 8.5, 4.8 and 3.9 bits per number."
    example: "8.5, 4.9 and 4.0 GB for an 8B model."
  # Shared with Days 9 and 10 (same text as day-09.yaml and day-10.yaml)
  - term: "Dense model"
    def: "a model that uses all of its numbers for every token."
    example: "Llama 3.1 8B."
  # Shared with Day 5 (same text as day-05.yaml)
  - term: "Prefix caching (prompt caching)"
    def: "the server keeps its notes on a prompt's opening and reuses them when the next request starts the same way."
    example: "740 ms for call 1, 36 ms for the rest in the lesson's sample."
  # Shared with Day 4 (same text as the Day 4 sheet)
  - term: "4-bit, 8-bit, 16-bit"
    def: "how many bits store each number; fewer bits, smaller model."
    example: "an 8B model is 8.5 GB at 8-bit, 4.9 GB at 4-bit."
  - term: "Bandwidth (memory bandwidth)"
    def: "how many GB per second memory delivers to the chip."
    example: "M4 Max 546 GB/s, H100 3,350 GB/s."
  - term: "Batching"
    def: "serving several people with one pass over the model."
    example: "8 people share each fetch of the weights."
  - term: "Bit"
    def: "a single 0 or 1; 8 bits make a byte."
    example: "a 16-bit number is 2 bytes."
  - term: "Blackwell"
    def: "the NVIDIA GPU generation after H100, with built-in 4-bit math."
    example: "B200, 8,000 GB/s."
  - term: "Byte"
    def: "8 bits."
    example: "one FP16 number takes 2 bytes."
  - term: "Ceiling (speed limit)"
    def: "the fastest a model can write: memory speed ÷ model size (for a mixture-of-experts model, only the part it reads per token)."
    example: "546 ÷ 4.9 = 111 tokens/s."
  - term: "Chip"
    def: "the processor that does the model's math."
    example: "an Apple M4 Max, or an NVIDIA H100 (a GPU)."
  - term: "Compute-bound"
    def: "slowed by calculation speed rather than memory."
    example: "prefill."
  - term: "Concurrency (people served at once)"
    def: "how many conversations the server runs at the same moment."
    example: "8 on the practice server."
  - term: "Context length (context, ctx)"
    def: "the most tokens one conversation may hold."
    example: "8K = 8,192 tokens."
  - term: "Decode"
    def: "the writing phase, one token at a time, fetching the whole model for each (a mixture-of-experts model fetches only the part it uses)."
    example: "86 tokens/s at 4-bit."
  - term: "Engine (inference server)"
    def: "the program that loads a model and answers requests."
    example: "llama.cpp, vLLM."
  - term: "Fetch"
    def: "move data from memory to the chip that does the math."
    example: "the whole 4.9 GB model is fetched once for every token written."
  - term: "FP8"
    def: "an 8-bit number format, 1 byte per number, with built-in math on H100."
    example: "a 70B model is 70 GB in FP8."
  - term: "GB"
    def: "1,000,000,000 bytes."
    example: "16,384 MiB = 17.18 GB."
  - term: "GPU"
    def: "the chip that runs the model."
    example: "H100; on a Mac it shares memory with everything else."
  - term: "H100"
    def: "NVIDIA's data-center GPU, 80 GB of memory at 3,350 GB/s."
    example: "the card in the KV Cache, GPU Bandwidth and Quantization videos."
  - term: "H200"
    def: "the H100's successor with faster memory."
    example: "4,800 GB/s against 3,350."
  - term: "Headroom"
    def: "spare capacity kept for surprises."
    example: "plan 18 replicas where 15 are needed."
  - term: "Knee"
    def: "the point where seats run out and waiting time shoots up."
    example: "after 8 people on the practice server."
  - term: "KV cache"
    def: "the model's notes on the conversation so far (keys and values), so it does not reread everything for each new word."
    example: "17.18 GB for one 131,072-token conversation."
  - term: "Latency"
    def: "how long someone waits."
    example: "time to the first token."
  - term: "Llama 3.1 8B, Llama 3 70B"
    def: "the open models used in the lessons and videos, with 8 and 70 billion parameters."
    example: "4.9 GB at 4-bit for the 8B."
  - term: "llama.cpp"
    def: "the open-source engine used on the Mac; `llama-server` answers requests, `llama-bench` times the engine alone."
    example: "Day 2's server."
  - term: "M4 Max, M4 Pro"
    def: "Apple chips whose memory moves 546 and 273 GB/s."
    example: "the lesson's sample Mac."
  - term: "Memory-bound (bandwidth-bound)"
    def: "slowed by how fast memory delivers data."
    example: "decode."
  - term: "ms (millisecond)"
    def: "a thousandth of a second."
    example: "500 ms is half a second."
  - term: "Notes"
    def: "this course's plain word for the KV cache."
    example: "128 KB of notes per token for Llama 3.1 8B."
  - term: "p95"
    def: "the value 95 out of 100 requests stay under."
    example: "95 of 100 prompts under 3,000 tokens."
  - term: "Parameters (8B, 70B)"
    def: "the model's learned numbers (weights)."
    example: "8B = 8 billion."
  - term: "Peak traffic"
    def: "the most people using the service at the same moment."
    example: "120."
  - term: "Practice server (mock)"
    def: "the kit's stand-in server with realistic behaviour and made-up numbers."
    example: "it has 8 slots."
  - term: "Prefill"
    def: "the reading phase; the model reads the whole prompt at once."
    example: "`pp512`."
  - term: "Prefill/decode interference"
    def: "long prompts being read slow the replies being written for others on the same server."
    example: "one of the things that moves the knee."
  - term: "Prompt"
    def: "the text you send the model."
    example: "a 3,000-token support question."
  - term: "Quantization (quantize)"
    def: "storing numbers with fewer bits."
    example: "16 to 8 to 4 bits, like saving a photo at lower quality."
  - term: "Replica"
    def: "one complete running copy of the server and model."
    example: "18 replicas for 120 people."
  - term: "Request"
    def: "one message sent to the model for an answer."
    example: "95 of 100 requests under 3,000 tokens."
  - term: "Scale"
    def: "one shared number stored with a small block of numbers so they can be squeezed into fewer bits."
    example: "why q8_0 is 1.0625 bytes, not 1."
  - term: "q8_0 (cache)"
    def: "llama.cpp's 8-bit format for the notes, 1.0625 bytes per number."
    example: "8,704 MiB instead of 16,384."
  - term: "Server"
    def: "a program that waits for requests and answers them."
    example: "llama.cpp's `llama-server`."
  - term: "SLO (service level objective)"
    def: "the speed promise."
    example: "95 of 100 requests get their first token within 500 ms."
  - term: "Slot"
    def: "one seat on the server, a conversation it can serve at the same time."
    example: "`--parallel 8` gives 8."
  - term: "Throughput"
    def: "total output across everyone at once."
    example: "275.1 tokens/s with 8 people."
  - term: "Token"
    def: "a chunk of text, about three quarters of a word."
    example: "1,000 tokens is roughly 750 words."
  - term: "Tokens per second (tok/s)"
    def: "how many tokens are written each second."
    example: "38.9 per person with 8 people."
  - term: "TTFT (time to first token)"
    def: "how long until the first token (word piece) of the reply appears."
    example: "41.4 ms (p95) at 8 people."
  - term: "Weights"
    def: "the model's learned numbers, fetched in full for every token written (a mixture-of-experts model fetches only the part it uses)."
    example: "4.9 GB for Llama 3.1 8B at 4-bit."
